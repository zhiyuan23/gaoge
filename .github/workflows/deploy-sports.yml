name: 部署 Sports 到生产环境

on:
  push:
    branches: [main]
    paths:
      - 'apps/sports/**'
      - 'packages/shared/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: deploy-sports-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: 校验与构建 Sports
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 Sports 测试
        run: pnpm --filter @gaoge/app-sports test

      - name: 校验 Sports
        run: pnpm --filter @gaoge/app-sports typecheck

      - name: 构建 Sports
        run: pnpm --filter @gaoge/app-sports build

  deploy:
    name: 部署 Sports 到服务器
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.SPORTS_DEPLOY_HOST || secrets.WEB_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.SPORTS_DEPLOY_USER || secrets.WEB_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.SPORTS_DEPLOY_PATH || secrets.WEB_DEPLOY_PATH }}
      HEALTH_URL: ${{ secrets.SPORTS_HEALTH_URL || secrets.WEB_HEALTH_URL }}

    steps:
      - name: 检查 Sports 部署配置
        run: |
          : "${DEPLOY_HOST:?SPORTS_DEPLOY_HOST or WEB_DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?SPORTS_DEPLOY_USER or WEB_DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?SPORTS_DEPLOY_PATH or WEB_DEPLOY_PATH is required}"
          : "${HEALTH_URL:?SPORTS_HEALTH_URL or WEB_HEALTH_URL is required}"

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Sports
        run: pnpm --filter @gaoge/app-sports build

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 写入服务器 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 确保 Sports 发布目录存在
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            mkdir -p $DEPLOY_PATH/releases/${{ github.sha }}
          "

      - name: 上传 Sports 构建产物
        run: |
          rsync -avz --delete \
            apps/sports/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/${{ github.sha }}/"

      - name: 切换 Sports 当前版本
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            rm -rf $DEPLOY_PATH/current
            ln -sfn $DEPLOY_PATH/releases/${{ github.sha }} $DEPLOY_PATH/current
          "

      - name: 健康检查
        run: |
          for i in {1..12}; do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
