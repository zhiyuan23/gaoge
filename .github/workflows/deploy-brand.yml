name: 部署 Brand 到生产环境

on:
  push:
    branches: [main]
    paths:
      - 'apps/brand/**'
      - 'packages/shared/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: gaoge-production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    name: 校验与构建 Brand
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --filter @gaoge/app-brand... --frozen-lockfile

      - name: 运行 Brand 测试
        run: pnpm --filter @gaoge/app-brand test

      - name: 校验 Brand
        run: pnpm --filter @gaoge/app-brand typecheck

      - name: 构建 Brand
        run: pnpm --filter @gaoge/app-brand build

  deploy:
    name: 部署 Brand 到服务器
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.BRAND_DEPLOY_HOST || secrets.WEB_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.BRAND_DEPLOY_USER || secrets.WEB_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.BRAND_DEPLOY_PATH }}
      HEALTH_URL: ${{ secrets.BRAND_HEALTH_URL }}
      TARGET_ID: gaoge-brand

    steps:
      - name: 检查 Brand 部署配置
        id: deploy-config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$HEALTH_URL" ]; then
            echo "::notice::BRAND_* secrets are not fully configured; skipping Brand deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 检出代码
        if: steps.deploy-config.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: 安装 pnpm
        if: steps.deploy-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        if: steps.deploy-config.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        if: steps.deploy-config.outputs.ready == 'true'
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        if: steps.deploy-config.outputs.ready == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        if: steps.deploy-config.outputs.ready == 'true'
        run: pnpm install --filter @gaoge/app-brand... --frozen-lockfile

      - name: 构建 Brand
        if: steps.deploy-config.outputs.ready == 'true'
        run: pnpm --filter @gaoge/app-brand build

      - name: 配置 SSH
        if: steps.deploy-config.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 写入服务器 known_hosts
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 执行发布前磁盘门禁
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager preflight --target '$TARGET_ID' &&
            sudo -n /usr/local/sbin/gaoge-release-manager register-start \
              --target '$TARGET_ID' \
              --release '$RELEASE_ID' \
              --git-sha '${{ github.sha }}' \
              --workflow-run '${{ github.run_id }}-${{ github.run_attempt }}'
          "

      - name: 确保 Brand 发布目录存在
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            RELEASE_DIR='$DEPLOY_PATH/releases/$RELEASE_ID'
            [ ! -e \"\$RELEASE_DIR\" ] || { echo \"Release ID has already been used: \$RELEASE_DIR\" >&2; exit 1; }
            mkdir \"\$RELEASE_DIR\"
          "

      - name: 上传 Brand 构建产物
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          rsync -avz --delete \
            apps/brand/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/"

      - name: 切换 Brand 当前版本
        id: switch-release
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager activate \
              --target '$TARGET_ID' --release '$RELEASE_ID'
          "

      - name: 健康检查
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          for i in {1..12}; do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: 记录成功版本并限量回收
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          if ! ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager mark-success \
              --target '$TARGET_ID' --release '$RELEASE_ID' \
              --git-sha '${{ github.sha }}' \
              --workflow-run '${{ github.run_id }}-${{ github.run_attempt }}'
          "; then
            echo "::warning::Brand release lifecycle success marker failed; the healthy release remains active"
          elif ! ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager prune \
              --target '$TARGET_ID' --max-delete 1
          "; then
            echo "::warning::Brand release lifecycle prune failed; the healthy release remains active"
          fi

      - name: 发布失败时恢复 Brand 版本
        id: rollback-release
        if: failure() && steps.deploy-config.outputs.ready == 'true' && steps.switch-release.outcome == 'success'
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager rollback --target '$TARGET_ID'
          "
          curl -fsS --retry 5 --retry-delay 3 "$HEALTH_URL" >/dev/null

      - name: 标记 Brand 失败版本
        if: failure() && steps.deploy-config.outputs.ready == 'true' && (steps.switch-release.outcome != 'success' || steps.rollback-release.outcome == 'success')
        run: |
          if ! ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            sudo -n /usr/local/sbin/gaoge-release-manager mark-failed \
              --target '$TARGET_ID' --release '$RELEASE_ID' --stage workflow
          "; then
            echo "::warning::Brand release lifecycle failure marker could not be written"
          fi
