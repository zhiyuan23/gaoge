name: 部署 API 到生产环境

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'packages/configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'scripts/deployment/verify-remote-runtime.sh'
      - 'scripts/deployment/production-database-guard.mjs'
  workflow_dispatch:

concurrency:
  group: gaoge-production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  API_RELEASE_DIR: '.deploy/api'
  API_RELEASE_ARCHIVE: 'api-release.tgz'
  API_RELEASE_ARTIFACT: 'api-release-bundle'

jobs:
  verify:
    name: 校验与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        run: pnpm --filter @gaoge/app-api db:generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build

      - name: 类型检查
        run: pnpm --filter @gaoge/app-api typecheck

      - name: 构建服务端
        run: pnpm --filter @gaoge/app-api build

      - name: 生成 API 发布目录
        run: |
          rm -rf ${{ env.API_RELEASE_DIR }}
          pnpm --filter @gaoge/app-api --prod deploy --legacy ${{ env.API_RELEASE_DIR }}

      - name: 生成发布目录 Prisma Client
        run: pnpm --dir ${{ env.API_RELEASE_DIR }} exec prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build

      - name: 压缩 API 发布包
        run: tar -czf ${{ env.API_RELEASE_ARCHIVE }} -C ${{ env.API_RELEASE_DIR }} .

      - name: 上传 API 发布包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_RELEASE_ARTIFACT }}
          path: ${{ env.API_RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v5

      - name: 下载 API 发布包
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_RELEASE_ARTIFACT }}
          path: ./artifact

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 写入服务器 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.API_DEPLOY_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 确保部署目录存在
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            mkdir -p \
              ${{ secrets.API_DEPLOY_PATH }}/releases/api \
              ${{ secrets.API_DEPLOY_PATH }}/shared \
              ${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state \
              ${{ secrets.API_DEPLOY_PATH }}/backups
          "

      - name: 上传部署守卫脚本
        run: |
          rsync -avz \
            scripts/deployment/verify-remote-runtime.sh \
            scripts/deployment/production-database-guard.mjs \
            ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }}:${{ secrets.API_DEPLOY_PATH }}/tmp/

      - name: 检查服务端运行环境
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            command -v node >/dev/null 2>&1 || { echo \"node not found\" >&2; exit 1; }
            command -v pm2 >/dev/null 2>&1 || { echo \"pm2 not found\" >&2; exit 1; }
            command -v psql >/dev/null 2>&1 || { echo \"psql not found\" >&2; exit 1; }
            command -v pg_dump >/dev/null 2>&1 || { echo \"pg_dump not found\" >&2; exit 1; }
            command -v pg_restore >/dev/null 2>&1 || { echo \"pg_restore not found\" >&2; exit 1; }
          '"

      - name: 保存发布回滚状态
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            DEPLOY_PATH=${{ secrets.API_DEPLOY_PATH }}
            STATE_DIR=\$DEPLOY_PATH/tmp/deploy-state/${{ github.sha }}
            SHARED_ENV_FILE=\$DEPLOY_PATH/shared/api.env

            mkdir -p \"\$STATE_DIR\"
            chmod 700 \"\$STATE_DIR\"
            if [ -L \"\$DEPLOY_PATH/current\" ]; then
              readlink -f \"\$DEPLOY_PATH/current\" > \"\$STATE_DIR/previous-release\"
            fi
            if [ -f \"\$SHARED_ENV_FILE\" ]; then
              cp -p \"\$SHARED_ENV_FILE\" \"\$STATE_DIR/previous-api.env\"
              chmod 600 \"\$STATE_DIR/previous-api.env\"
              touch \"\$STATE_DIR/had-api-env\"
            fi
          '"

      - name: 原子写入并验证服务端环境变量
        run: |
          if [ -z "${{ secrets.DEPLOY_ENV_FILE_API }}" ]; then
            echo "GitHub Secret DEPLOY_ENV_FILE_API 为空" >&2
            exit 1
          fi

          NEXT_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env.next-${{ github.sha }}
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "umask 077; cat > \"${NEXT_ENV_FILE}\"" <<'EOF'
          ${{ secrets.DEPLOY_ENV_FILE_API }}
          EOF

          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            NEXT_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env.next-${{ github.sha }}
            SHARED_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs validate \
              --env-file \"\$NEXT_ENV_FILE\"

            chmod 600 \"\$NEXT_ENV_FILE\"
            mv \"\$NEXT_ENV_FILE\" \"\$SHARED_ENV_FILE\"
          '"

      - name: 解压 API 发布包
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }}
            rm -rf \"\$RELEASE_DIR\"
            mkdir -p \"\$RELEASE_DIR\"
          '"

          rsync -avz \
            ./artifact/${{ env.API_RELEASE_ARCHIVE }} \
            ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }}:${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }}/${{ env.API_RELEASE_ARCHIVE }}

          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }}
            tar -xzf \"\$RELEASE_DIR/${{ env.API_RELEASE_ARCHIVE }}\" -C \"\$RELEASE_DIR\"
            rm -f \"\$RELEASE_DIR/${{ env.API_RELEASE_ARCHIVE }}\"
            ln -sfn ${{ secrets.API_DEPLOY_PATH }}/shared/api.env \"\$RELEASE_DIR/.env\"
          '"

      - name: 校验、备份并执行生产迁移
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }}
            cd \"\$RELEASE_DIR\"

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs probe \
              --env-file .env

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs backup \
              --env-file .env \
              --backup-dir ${{ secrets.API_DEPLOY_PATH }}/backups \
              --retention 14

            set -a
            . ./.env
            set +a
            echo Remote API migration started
            date
            free -h || true
            ps -eo pid,ppid,user,stat,etime,rss,pmem,pcpu,cmd --sort=-rss | head -20 || true
            ./node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
          '"

      - name: 切换 API 版本并重启 PM2
        id: switch-release
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            STATE_DIR=${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state/${{ github.sha }}
            touch \"\$STATE_DIR/switched\"
            rm -rf ${{ secrets.API_DEPLOY_PATH }}/current
            ln -sfn ${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }} ${{ secrets.API_DEPLOY_PATH }}/current
            pm2 delete gaoge-api >/dev/null 2>&1 || true
            cd ${{ secrets.API_DEPLOY_PATH }}/current
            set -a
            . ./.env
            set +a
            echo Restarting gaoge-api with PM2
            date
            free -h || true
            ps -eo pid,ppid,user,stat,etime,rss,pmem,pcpu,cmd --sort=-rss | head -20 || true
            pm2 start ecosystem.config.cjs --only gaoge-api --update-env
          '"

      - name: 运行 API 运行时守卫
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            EXPECTED_PM2_NAME='gaoge-api' \
            FORBIDDEN_PM2_NAMES='gaoge-server' \
            EXPECTED_DEPLOY_PATH='${{ secrets.API_DEPLOY_PATH }}' \
            EXPECTED_RELEASE_PATH='${{ secrets.API_DEPLOY_PATH }}/releases/api/${{ github.sha }}' \
            EXPECTED_DB_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DB_PORT='5432' \
            EXPECTED_DB_NAME='gaoge_db' \
            DATABASE_GUARD_PATH='${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs' \
            API_BASE_URL='https://api.gaoge.cc' \
            CRITICAL_PATHS='/health /health/db' \
            NON_EMPTY_PATHS='/football/players?page=1&pageSize=1 /football/teams?page=1&pageSize=1 /football/match-rounds?page=1&pageSize=1 /football/asset-records?page=1&pageSize=1' \
            CORS_ORIGIN='https://admin.gaoge.cc' \
            CORS_PATH='/auth/admin/login' \
            bash ${{ secrets.API_DEPLOY_PATH }}/tmp/verify-remote-runtime.sh
          '"

      - name: 保存已验证的 PM2 状态
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            pm2 save
          '"

      - name: 发布失败时恢复 API 版本与环境
        if: failure()
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true

            DEPLOY_PATH=${{ secrets.API_DEPLOY_PATH }}
            STATE_DIR=\$DEPLOY_PATH/tmp/deploy-state/${{ github.sha }}
            SHARED_ENV_FILE=\$DEPLOY_PATH/shared/api.env
            NEXT_ENV_FILE=\$DEPLOY_PATH/shared/api.env.next-${{ github.sha }}

            if [ ! -d \"\$STATE_DIR\" ]; then
              echo \"No rollback state was created; nothing to restore\"
              exit 0
            fi

            rm -f \"\$NEXT_ENV_FILE\"
            if [ -f \"\$STATE_DIR/previous-api.env\" ]; then
              cp -p \"\$STATE_DIR/previous-api.env\" \"\$SHARED_ENV_FILE.rollback-${{ github.sha }}\"
              chmod 600 \"\$SHARED_ENV_FILE.rollback-${{ github.sha }}\"
              mv \"\$SHARED_ENV_FILE.rollback-${{ github.sha }}\" \"\$SHARED_ENV_FILE\"
            elif [ ! -f \"\$STATE_DIR/had-api-env\" ]; then
              rm -f \"\$SHARED_ENV_FILE\"
            fi

            previous_release=
            if [ -s \"\$STATE_DIR/previous-release\" ]; then
              previous_release=\$(cat \"\$STATE_DIR/previous-release\")
            fi

            if [ -n \"\$previous_release\" ] && [ -d \"\$previous_release\" ]; then
              rm -rf \"\$DEPLOY_PATH/current\"
              ln -sfn \"\$previous_release\" \"\$DEPLOY_PATH/current\"
            fi

            if [ -f \"\$STATE_DIR/switched\" ]; then
              [ -n \"\$previous_release\" ] || {
                echo \"Cannot restart gaoge-api: previous release is unavailable\" >&2
                exit 1
              }
              pm2 delete gaoge-api >/dev/null 2>&1 || true
              cd \"\$DEPLOY_PATH/current\"
              set -a
              . ./.env
              set +a
              pm2 start ecosystem.config.cjs --only gaoge-api --update-env
              curl -fsS --retry 5 --retry-delay 3 https://api.gaoge.cc/health >/dev/null
              curl -fsS --retry 5 --retry-delay 3 https://api.gaoge.cc/health/db >/dev/null
              pm2 save
            fi
          '"

      - name: 输出 PM2 状态
        if: always()
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true

            pm2 status gaoge-api
            pm2 logs gaoge-api --lines 50 --nostream
          '"
