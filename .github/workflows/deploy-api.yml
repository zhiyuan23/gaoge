name: 部署 API 到生产环境

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'packages/configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'scripts/deployment/verify-remote-runtime.sh'
      - 'scripts/deployment/production-database-guard.mjs'
      - 'scripts/deployment/rollback-api-release.sh'
      - 'scripts/deployment/prepare-api-rollback-state.sh'
  workflow_dispatch:

concurrency:
  group: gaoge-production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  API_RELEASE_DIR: '.deploy/api'
  API_RELEASE_ARCHIVE: 'api-release.tgz'
  API_RELEASE_ARTIFACT: 'api-release-bundle'
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    name: 校验与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        run: pnpm --filter @gaoge/app-api db:generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build

      - name: 类型检查
        run: pnpm --filter @gaoge/app-api typecheck

      - name: 构建服务端
        run: pnpm --filter @gaoge/app-api build

      - name: 生成 API 发布目录
        run: |
          rm -rf ${{ env.API_RELEASE_DIR }}
          pnpm --filter @gaoge/app-api --prod deploy --legacy ${{ env.API_RELEASE_DIR }}

      - name: 生成发布目录 Prisma Client
        run: pnpm --dir ${{ env.API_RELEASE_DIR }} exec prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build

      - name: 压缩 API 发布包
        run: tar -czf ${{ env.API_RELEASE_ARCHIVE }} -C ${{ env.API_RELEASE_DIR }} .

      - name: 上传 API 发布包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_RELEASE_ARTIFACT }}
          path: ${{ env.API_RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    env:
      TARGET_ID: gaoge-api

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v5

      - name: 下载 API 发布包
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_RELEASE_ARTIFACT }}
          path: ./artifact

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 写入服务器 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.API_DEPLOY_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 确保部署目录存在
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            mkdir -p \
              ${{ secrets.API_DEPLOY_PATH }}/releases/api \
              ${{ secrets.API_DEPLOY_PATH }}/shared \
              ${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state \
              ${{ secrets.API_DEPLOY_PATH }}/backups
          "

      - name: 上传部署守卫脚本
        run: |
          rsync -avz \
            scripts/deployment/verify-remote-runtime.sh \
            scripts/deployment/production-database-guard.mjs \
            scripts/deployment/rollback-api-release.sh \
            scripts/deployment/prepare-api-rollback-state.sh \
            ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }}:${{ secrets.API_DEPLOY_PATH }}/tmp/

      - name: 检查服务端运行环境
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            command -v node >/dev/null 2>&1 || { echo \"node not found\" >&2; exit 1; }
            command -v pm2 >/dev/null 2>&1 || { echo \"pm2 not found\" >&2; exit 1; }
            command -v psql >/dev/null 2>&1 || { echo \"psql not found\" >&2; exit 1; }
            command -v pg_dump >/dev/null 2>&1 || { echo \"pg_dump not found\" >&2; exit 1; }
            command -v pg_restore >/dev/null 2>&1 || { echo \"pg_restore not found\" >&2; exit 1; }
            command -v realpath >/dev/null 2>&1 || { echo \"realpath not found\" >&2; exit 1; }
            command -v cmp >/dev/null 2>&1 || { echo \"cmp not found\" >&2; exit 1; }
            node -e \"if (Number.parseInt(process.versions.node, 10) !== 22) process.exit(1)\" || {
              echo \"production Node 22 is required\" >&2
              exit 1
            }
          '"

      - name: 执行发布前磁盘门禁
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            sudo -n /usr/local/sbin/gaoge-release-manager preflight --target '$TARGET_ID' &&
            sudo -n /usr/local/sbin/gaoge-release-manager register-start \
              --target '$TARGET_ID' \
              --release '$RELEASE_ID' \
              --git-sha '${{ github.sha }}' \
              --workflow-run '${{ github.run_id }}-${{ github.run_attempt }}'
          "

      - name: 保存发布回滚状态
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            DEPLOY_PATH=${{ secrets.API_DEPLOY_PATH }}
            STATE_ROOT=\$DEPLOY_PATH/tmp/deploy-state
            STATE_DIR=\$STATE_ROOT/${{ github.run_id }}-${{ github.run_attempt }}
            SHARED_ENV_FILE=\$DEPLOY_PATH/shared/api.env

            find \"\$STATE_ROOT\" -mindepth 1 -maxdepth 1 -type d -mmin +1440 -exec rm -rf -- {} +
            DEPLOY_PATH=\"\$DEPLOY_PATH\" \
            STATE_ROOT=\"\$STATE_ROOT\" \
            STATE_DIR=\"\$STATE_DIR\" \
            SHARED_ENV_FILE=\"\$SHARED_ENV_FILE\" \
            bash \"\$DEPLOY_PATH/tmp/prepare-api-rollback-state.sh\"
          '"

      - name: 原子写入并验证服务端环境变量
        env:
          DEPLOY_ENV_FILE_API: ${{ secrets.DEPLOY_ENV_FILE_API }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_ENV_FILE_API" ]; then
            echo "GitHub Secret DEPLOY_ENV_FILE_API 为空" >&2
            exit 1
          fi

          NEXT_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env.next-$RELEASE_ID
          printf '%s\n' "$DEPLOY_ENV_FILE_API" |
            ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "umask 077; cat > \"${NEXT_ENV_FILE}\""

          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            NEXT_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env.next-$RELEASE_ID
            SHARED_ENV_FILE=${{ secrets.API_DEPLOY_PATH }}/shared/api.env
            STATE_DIR=${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state/${{ github.run_id }}-${{ github.run_attempt }}

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs validate \
              --env-file \"\$NEXT_ENV_FILE\"

            chmod 600 \"\$NEXT_ENV_FILE\"
            touch \"\$STATE_DIR/env-installing\"
            mv \"\$NEXT_ENV_FILE\" \"\$SHARED_ENV_FILE\"
            mv \"\$STATE_DIR/env-installing\" \"\$STATE_DIR/env-installed\"
          '"

      - name: 解压 API 发布包
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/$RELEASE_ID
            [ ! -e \"\$RELEASE_DIR\" ] || { echo \"Release ID has already been used: \$RELEASE_DIR\" >&2; exit 1; }
            mkdir \"\$RELEASE_DIR\"
          '"

          rsync -avz \
            ./artifact/${{ env.API_RELEASE_ARCHIVE }} \
            ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }}:${{ secrets.API_DEPLOY_PATH }}/releases/api/$RELEASE_ID/${{ env.API_RELEASE_ARCHIVE }}

          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/$RELEASE_ID
            tar -xzf \"\$RELEASE_DIR/${{ env.API_RELEASE_ARCHIVE }}\" -C \"\$RELEASE_DIR\"
            rm -f \"\$RELEASE_DIR/${{ env.API_RELEASE_ARCHIVE }}\"
            ln -sfn ${{ secrets.API_DEPLOY_PATH }}/shared/api.env \"\$RELEASE_DIR/.env\"
            ln -sfn ${{ secrets.API_DEPLOY_PATH }}/shared/oss.env \"\$RELEASE_DIR/.env.oss\"
          '"

      - name: 校验、备份并执行生产迁移
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            RELEASE_DIR=${{ secrets.API_DEPLOY_PATH }}/releases/api/$RELEASE_ID
            cd \"\$RELEASE_DIR\"

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs probe \
              --env-file .env

            EXPECTED_DATABASE_HOST='${{ secrets.EXPECTED_DATABASE_HOST }}' \
            EXPECTED_DATABASE_PORT='5432' \
            EXPECTED_DATABASE_NAME='gaoge_db' \
            node ${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs backup \
              --env-file .env \
              --backup-dir ${{ secrets.API_DEPLOY_PATH }}/backups \
              --retention 14

            echo Remote API migration started
            date
            free -h || true
            ps -eo pid,ppid,user,stat,etime,rss,pmem,pcpu,cmd --sort=-rss | head -20 || true
            env -i HOME=\"\$HOME\" PATH=\"\$PATH\" \
              node --env-file=.env ./node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
          '"

      - name: 切换 API 版本并重启 PM2
        id: switch-release
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            DEPLOY_PATH=${{ secrets.API_DEPLOY_PATH }}
            STATE_DIR=\$DEPLOY_PATH/tmp/deploy-state/${{ github.run_id }}-${{ github.run_attempt }}
            CURRENT_LINK=\$DEPLOY_PATH/current
            sudo -n /usr/local/sbin/gaoge-release-manager activate \
              --target '$TARGET_ID' --release '$RELEASE_ID'
            touch \"\$STATE_DIR/switched\"
            PM2_HOME_VALUE=\${PM2_HOME:-\$HOME/.pm2}
            env -i HOME=\"\$HOME\" PATH=\"\$PATH\" PM2_HOME=\"\$PM2_HOME_VALUE\" \
              pm2 delete gaoge-api >/dev/null 2>&1 || true
            cd \"\$CURRENT_LINK\"
            echo Restarting gaoge-api with PM2
            date
            free -h || true
            ps -eo pid,ppid,user,stat,etime,rss,pmem,pcpu,cmd --sort=-rss | head -20 || true
            env -i HOME=\"\$HOME\" PATH=\"\$PATH\" PM2_HOME=\"\$PM2_HOME_VALUE\" \
              pm2 start ecosystem.config.cjs --only gaoge-api --update-env
          '"

      - name: 运行 API 运行时守卫
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -eo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            set -u

            EXPECTED_PM2_NAME=\"gaoge-api\" \
            FORBIDDEN_PM2_NAMES=\"gaoge-server\" \
            EXPECTED_DEPLOY_PATH=\"${{ secrets.API_DEPLOY_PATH }}\" \
            EXPECTED_RELEASE_PATH=\"${{ secrets.API_DEPLOY_PATH }}/releases/api/$RELEASE_ID\" \
            EXPECTED_DB_HOST=\"${{ secrets.EXPECTED_DATABASE_HOST }}\" \
            EXPECTED_DB_PORT=\"5432\" \
            EXPECTED_DB_NAME=\"gaoge_db\" \
            DATABASE_GUARD_PATH=\"${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs\" \
            API_BASE_URL=\"https://api.gaoge.cc\" \
            CRITICAL_PATHS=\"/health /health/db\" \
            NON_EMPTY_PATHS=\"/football/players?page=1&pageSize=1 /football/teams?page=1&pageSize=1 /football/match-rounds?page=1&pageSize=1 /football/asset-records?page=1&pageSize=1\" \
            CORS_ORIGIN=\"https://admin.gaoge.cc\" \
            CORS_PATH=\"/auth/admin/login\" \
            bash ${{ secrets.API_DEPLOY_PATH }}/tmp/verify-remote-runtime.sh
          '"

      - name: 保存已验证的 PM2 状态
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true
            PM2_HOME_VALUE=\${PM2_HOME:-\$HOME/.pm2}
            env -i HOME=\"\$HOME\" PATH=\"\$PATH\" PM2_HOME=\"\$PM2_HOME_VALUE\" pm2 save
            STATE_DIR=${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state/${{ github.run_id }}-${{ github.run_attempt }}
            rm -rf \"\$STATE_DIR\"
          '"

      - name: 记录成功版本并限量回收
        run: |
          if ! ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            sudo -n /usr/local/sbin/gaoge-release-manager mark-success \
              --target '$TARGET_ID' --release '$RELEASE_ID' \
              --git-sha '${{ github.sha }}' \
              --workflow-run '${{ github.run_id }}-${{ github.run_attempt }}'
          "; then
            echo "::warning::API release lifecycle success marker failed; the healthy release remains active"
          elif ! ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            sudo -n /usr/local/sbin/gaoge-release-manager prune \
              --target '$TARGET_ID' --max-delete 1
          "; then
            echo "::warning::API release lifecycle prune failed; the healthy release remains active"
          fi

      - name: 发布失败时恢复 API 版本与环境
        id: rollback-release
        if: failure()
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            set -euo pipefail
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true

            DEPLOY_PATH=\"${{ secrets.API_DEPLOY_PATH }}\" \
            STATE_DIR=\"${{ secrets.API_DEPLOY_PATH }}/tmp/deploy-state/${{ github.run_id }}-${{ github.run_attempt }}\" \
            SHARED_ENV_FILE=\"${{ secrets.API_DEPLOY_PATH }}/shared/api.env\" \
            NEXT_ENV_FILE=\"${{ secrets.API_DEPLOY_PATH }}/shared/api.env.next-$RELEASE_ID\" \
            ROLLBACK_TOKEN=\"$RELEASE_ID\" \
            RUNTIME_GUARD_PATH=\"${{ secrets.API_DEPLOY_PATH }}/tmp/verify-remote-runtime.sh\" \
            EXPECTED_PM2_NAME=\"gaoge-api\" \
            FORBIDDEN_PM2_NAMES=\"gaoge-server\" \
            EXPECTED_DEPLOY_PATH=\"${{ secrets.API_DEPLOY_PATH }}\" \
            EXPECTED_DB_HOST=\"${{ secrets.EXPECTED_DATABASE_HOST }}\" \
            EXPECTED_DB_PORT=\"5432\" \
            EXPECTED_DB_NAME=\"gaoge_db\" \
            DATABASE_GUARD_PATH=\"${{ secrets.API_DEPLOY_PATH }}/tmp/production-database-guard.mjs\" \
            API_BASE_URL=\"https://api.gaoge.cc\" \
            CRITICAL_PATHS=\"/health /health/db\" \
            NON_EMPTY_PATHS=\"/football/players?page=1&pageSize=1 /football/teams?page=1&pageSize=1 /football/match-rounds?page=1&pageSize=1 /football/asset-records?page=1&pageSize=1\" \
            CORS_ORIGIN=\"https://admin.gaoge.cc\" \
            CORS_PATH=\"/auth/admin/login\" \
            bash ${{ secrets.API_DEPLOY_PATH }}/tmp/rollback-api-release.sh
          '"

      - name: 标记 API 失败版本
        if: failure() && steps.rollback-release.outcome == 'success'
        run: |
          if ! ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "
            sudo -n /usr/local/sbin/gaoge-release-manager mark-failed \
              --target '$TARGET_ID' --release '$RELEASE_ID' --stage workflow
          "; then
            echo "::warning::API release lifecycle failure marker could not be written"
          fi

      - name: 输出 PM2 状态
        if: always()
        run: |
          ssh ${{ secrets.API_DEPLOY_USER }}@${{ secrets.API_DEPLOY_HOST }} "bash -lc '
            [ -f ~/.bashrc ] && set +u && . ~/.bashrc && set -u || true
            [ -f ~/.profile ] && set +u && . ~/.profile && set -u || true

            pm2 status gaoge-api
            pm2 logs gaoge-api --lines 50 --nostream
          '"
